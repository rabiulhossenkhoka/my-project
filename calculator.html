<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>This is a calculator app</title>
</head>
<style>
    * {

        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }


    body {
        width: 100%;
        height: 100vh;
        border: 1px solid black;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(45deg, #0a0a0a, #3a4452);



    }

    .container {
        border: 1px solid #3a4452;
        padding: 20px;
        border-radius: 16px;
        background: transparent;
        box-shadow: 0px 3px 15px rgba(114, 123, 211, 0.5);

    }

    input {
        width: 200px;
        border: none;
        padding: 24px;
        margin: 15px;
        background: transparent;
        box-shadow: 0px 3px 15px rgba(114, 123, 211, 0.5);
        font-size: 40px;
        text-align: right;
        cursor: pointer;


    }

    input::placeholder {
        color: aliceblue;
    }

    button {
        border: none;
        width: 60px;
        height: 60px;
        margin: 5px;
        border-radius: 50%;
        font-size: larger;
        /* text-transform: uppercase; */
        color: rgb(96, 92, 86);
        background: transparent;
        box-shadow: -1px -5px 5px chocolate;
        cursor: copy;
    }
</style>

<body>
    <div class="container">
        <input type="text" placeholder="0" id="dom">

        <div><button>ac</button>
            <button> %</button>
            <button> del</button>
            <button> *</button>
        </div>
        <div><button> 1</button>
            <button>2</button>
            <button>3</button>
            <button>4</button>
        </div>
        <div><button>5</button>
            <button>6</button>
            <button>7</button>
            <button>8</button>
        </div>
        <div><button>9</button>
            <button>0</button>
            <button>+</button>
            <button>_</button>
        </div>
        <div><button>=</button>
            <button>/</button>


        </div>




    </div>
    <script src="script.js"></script>

</body>

</html>
